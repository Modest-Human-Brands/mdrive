$kind: http-request
description: 'Creates an upload batch and returns presigned R2 upload URLs. Requires the x-org-id header (organization slug).'
url: '{{base_url}}/api/media/uploads'
method: POST
headers:
  x-org-id: '{{org_id}}'
body:
  type: json
  content: |-
    {
        "projectId": "304ee3b0-289a-81f5-9261-c410967f5a36",
        "files": [
            {
                "filename": "wallpaper-1.jpg",
                "mimeType": "image/jpeg",
                "sizeBytes": 1886553
            },
            {
                "filename": "wallpaper-3.jpg",
                "mimeType": "image/jpeg",
                "sizeBytes": 1458751
            }
        ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
      const body = pm.response.json();
      pm.test("Returns a batch with upload URLs", function () {
          pm.expect(body.batchId).to.match(/^batch_/);
          pm.expect(body.uploads).to.be.an("array").that.is.not.empty;
          pm.expect(body.uploads[0]).to.have.keys("filename", "uploadId", "uploadUrl");
      });
      pm.collectionVariables.set("uploadUrl", body.uploads[0].uploadUrl);
      pm.collectionVariables.set("batchId", body.batchId);
    language: text/javascript
order: 3000
