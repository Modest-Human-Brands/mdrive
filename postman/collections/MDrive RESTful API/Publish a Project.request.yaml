$kind: http-request
description: 'Sets the project status to Delivered in Notion. projectId is the Notion project page UUID.'
url: '{{base_url}}/api/projects/:projectId/publish'
method: POST
headers:
  Content-Type: application/json
pathVariables:
  projectId: 304ee3b0-289a-81f5-9261-c410967f5a36
body:
  type: json
  content: |-
    {
        "notify": true
      }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
      pm.test("Echoes notify", function () { pm.expect(pm.response.json().notify).to.eql(true); });
    language: text/javascript
order: 9000
