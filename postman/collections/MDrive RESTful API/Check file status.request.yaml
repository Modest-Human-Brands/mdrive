$kind: http-request
description: 'Returns per-file status and progress for an upload batch (batchId is set by the upload-URL request).'
url: '{{base_url}}/api/media/uploads/:batchId'
method: GET
pathVariables:
  batchId: '{{batchId}}'
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
      pm.test("Lists uploads", function () { pm.expect(pm.response.json().uploads).to.be.an("array"); });
    language: text/javascript
order: 5000
