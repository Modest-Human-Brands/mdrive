$kind: http-request
description: "Returns presigned download URLs for a project's media (or the given mediaIds). Requires the x-org-id header (organization slug)."
url: '{{base_url}}/api/media/downloads'
method: POST
headers:
  x-org-id: '{{org_id}}'
body:
  type: json
  content: |-
    {
        "projectId": "304ee3b0-289a-81f5-9261-c410967f5a36"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
      const body = pm.response.json();
      pm.test("Returns signed assets", function () {
          pm.expect(body.expiresIn).to.eql(3600);
          pm.expect(body.assets).to.be.an("array").that.is.not.empty;
          pm.expect(body.assets[0]).to.have.keys("mediaId", "filename", "downloadUrl");
      });
    language: text/javascript
order: 10000
