$kind: http-request
description: 'Returns paginated media for a project (Notion project page UUID), optionally filtered by status.'
url: '{{base_url}}/api/projects/:projectId/media?status=release'
method: GET
queryParams:
  - key: status
    value: release
  - key: page
    value: '2'
    disabled: true
  - key: limit
    value: '12'
    disabled: true
pathVariables:
  projectId: 304ee3b0-289a-81f5-9261-c410967f5a36
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
      const body = pm.response.json();
      pm.test("Returns data and totalItems", function () {
          pm.expect(body.data).to.be.an("array");
          pm.expect(body.totalItems).to.be.a("number");
      });
      pm.test("Items have id, url, status and type", function () {
          body.data.forEach(function (item) { pm.expect(item).to.include.keys("id", "url", "status", "type"); });
      });
    language: text/javascript
order: 8000
