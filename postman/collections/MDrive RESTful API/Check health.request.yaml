$kind: http-request
description: 'Returns service status, version, build time and host node.'
url: '{{base_url}}/api/health'
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
      pm.test("Reports OK", function () { pm.expect(pm.response.json().status).to.eql("OK"); });
    language: text/javascript
order: 2000
