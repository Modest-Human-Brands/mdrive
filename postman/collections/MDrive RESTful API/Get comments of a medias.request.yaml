$kind: http-request
description: 'Returns comment threads keyed by media page UUID.'
url: '{{base_url}}/api/media/comments/query'
method: POST
body:
  type: json
  content: |-
    {
        "mediaIds": [
            "304ee3b0-289a-817e-8f5a-ce45b13ffeaf"
        ]
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
      pm.test("Returns timelines", function () { pm.expect(pm.response.json().timelines).to.be.an("object"); });
    language: text/javascript
order: 12000
