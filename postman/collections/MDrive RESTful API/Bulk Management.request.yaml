$kind: http-request
description: 'Bulk approval: sets the Notion status of the given media page UUIDs (approved, rejected or pending).'
url: '{{base_url}}/api/media/action'
method: POST
body:
  type: json
  content: |-
    {
        "action": "approve",
        "mediaIds": [
            "304ee3b0-289a-817e-8f5a-ce45b13ffeaf"
        ],
        "params": {
            "status": "approved"
        }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
      const body = pm.response.json();
      pm.test("Updated assets", function () {
          pm.expect(body.success).to.eql(true);
          pm.expect(body.updatedCount).to.be.above(0);
      });
    language: text/javascript
order: 13000
