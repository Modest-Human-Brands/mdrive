$kind: http-request
description: 'Adds a comment, or a threaded reply when parentId is set, to each listed media page UUID.'
url: '{{base_url}}/api/media/comments'
method: POST
body:
  type: json
  content: |-
    {
        "mediaIds": [
            "304ee3b0-289a-817e-8f5a-ce45b13ffeaf"
        ],
        "parentId": null,
        "text": "Make the lighting slightly warmer here.",
        "coordinates": {
            "x": 45.2,
            "y": 62.8
        },
        "author":{
            "name": "Shirsendu Bairagi",
            "role": "Developer"
        }
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
      const body = pm.response.json();
      pm.test("Returns created comments", function () {
          pm.expect(body.comments).to.be.an("array").that.is.not.empty;
          pm.expect(body.comments[0].commentId).to.match(/^cmt_/);
      });
    language: text/javascript
order: 11000
