$kind: http-request
description: 'Callback used by ingestion workers to report upload status and persist file metadata.'
url: '{{base_url}}/webhook/uploads/status'
method: PUT
body:
  type: json
  content: |-
    {
        "filename": "photo-0001-0008-0010-001.jpg",
        "status": "completed",
        "progressPercent": 100,
        "mediaId": null,
        "error": null,
        "data": {
          "metadata": {
            "kind": "photo",
            "format": { "formatName": "jpeg", "width": 5760, "height": 3840 }
          }
        }
      }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
      pm.test("Reports success", function () { pm.expect(pm.response.json().success).to.eql(true); });
    language: text/javascript
order: 1000
