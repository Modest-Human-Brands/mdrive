$kind: http-request
description: 'Returns project metadata and the storage and approval breakdown per media type. projectId is the Notion project page UUID.'
url: '{{base_url}}/api/projects/:projectId'
method: GET
pathVariables:
  projectId: 304ee3b0-289a-81f5-9261-c410967f5a36
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () { pm.response.to.have.status(200); });
      const body = pm.response.json();
      pm.test("Has project fields and media summary", function () {
          pm.expect(body).to.include.keys("id", "name", "status", "config", "mediaSummary");
          pm.expect(body.mediaSummary.totals.count).to.be.a("number");
          pm.expect(body.mediaSummary.breakdown.photo.approval).to.include.keys("pending", "approved", "rejected", "release", "archive");
      });
    language: text/javascript
order: 7000
